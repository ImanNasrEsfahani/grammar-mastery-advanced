name: Advanced Seed CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundary-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Advanced content boundary
        run: python tools/check_advanced_content_boundary.py
      - name: Python compile
        run: python -m compileall -q src docker/backend ops/stage26
      - name: Verify schema migration plan
        run: python ops/stage26/migration_runner.py --target staging

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_DEFAULT_LOCALE: fa
          DJANGO_API_BASE_URL: http://127.0.0.1:8000/api/v1
