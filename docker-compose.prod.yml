name: grammar-mastery-advanced

services:
  postgres:
    image: postgres:15-bookworm
    pull_policy: missing
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: gmp_runtime.settings
      DJANGO_DB_HOST: postgres
      DJANGO_DB_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: grammarb2.imannasr.com,localhost,127.0.0.1,backend
      DJANGO_CSRF_TRUSTED_ORIGINS: https://grammarb2.imannasr.com
      DJANGO_DEBUG: "false"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      PASSWORD_RESET_PUBLIC_ORIGIN: https://grammarb2.imannasr.com
      STAGE21_JWT_ISSUER: grammar-mastery-advanced
      STAGE21_JWT_AUDIENCE: grammar-mastery-advanced-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8006:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app

  frontend:
    image: ghcr.io/imannasresfahani/grammar-mastery-advanced-frontend:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DJANGO_API_BASE_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_DEFAULT_LOCALE: fa
      GMP_SESSION_COOKIE_SECURE: "true"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3006:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app

volumes:
  postgres_data:

networks:
  app:
    driver: bridge
